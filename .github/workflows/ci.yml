name: CI

on:
  push:
    branches: [main, rebuild/nest-next]
  pull_request:
    branches: [main, rebuild/nest-next]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client & build shared types
        run: pnpm --filter @medibook/api exec prisma generate && pnpm --filter @medibook/shared build

      - name: Lint monorepo
        run: pnpm lint

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Build api, worker, and web
        run: pnpm build

  integration-tests:
    name: Backend & Worker Testcontainers Integration Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client & build shared package
        run: pnpm --filter @medibook/api exec prisma generate && pnpm --filter @medibook/shared build

      - name: Run Worker integration tests (Testcontainers Postgres + Redis + Mailpit)
        run: pnpm --filter @medibook/worker test

      - name: Run API integration tests (Testcontainers Postgres+pgvector + Redis + MinIO)
        run: pnpm --filter @medibook/api test

  ai-evals:
    name: Python AI RAG & Triage ML Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install AI dependencies (CPU torch + ML + Testcontainers)
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install fastapi uvicorn pydantic pydantic-settings httpx numpy psycopg2-binary pgvector scikit-learn sentence-transformers pytest testcontainers

      - name: Run AI evaluations against Testcontainer pgvector
        env:
          LLM_PROVIDER: mock
        run: pytest services/ai/evals/test_evals.py -v

  playwright-e2e:
    name: Full-Stack Docker Compose & Playwright E2E
    runs-on: ubuntu-latest
    needs: [lint-typecheck-build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies & Chromium browser
        run: pnpm install --frozen-lockfile && npx playwright install chromium --with-deps

      - name: Boot production Docker Compose stack behind Nginx
        run: docker compose up -d --build postgres redis minio mailpit livekit api-1 api-2 worker web nginx

      - name: Seed database inside API container
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost/api/health/ready; then break; fi
            sleep 2
          done
          docker compose exec -T api-1 sh -c 'npx prisma db seed || node apps/api/dist/main.js --version || true'

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost
        run: npx playwright test e2e/patient-flow.spec.ts e2e/emergency-flow.spec.ts e2e/accessibility.spec.ts

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
