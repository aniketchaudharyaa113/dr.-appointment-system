[project]
name = "medibook-ai"
version = "0.2.0"
description = "MediBook Telehealth AI Service (Hybrid pgvector+tsvector RAG, ML Emergency Triage, Booking Agent, Doctor Copilot)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
