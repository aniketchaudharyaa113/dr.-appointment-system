global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'medibook-api'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['api-1:4000', 'api-2:4000']
        labels:
          environment: 'production'
          service: 'medibook-monolith'

  - job_name: 'medibook-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:4001']
        labels:
          environment: 'production'
          service: 'bullmq-worker'
